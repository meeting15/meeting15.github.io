<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_FAILURE</title>
    <style>
        body {
            background-color: #030303;
            color: #00ff66; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; 
        }

        #splash-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #030303;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff66;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .arg-image {
            max-width: 75%;
            max-height: 45vh;
            filter: grayscale(100%) contrast(200%) brightness(70%) blur(0.5px);
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            margin-bottom: 30px;
            animation: image-flicker 0.15s infinite;
        }

        .glitch {
            font-size: 0.95rem; 
            font-weight: normal; 
            text-transform: lowercase; 
            position: relative;
            letter-spacing: 2px;
            animation: shake 0.12s infinite, color-flash 0.35s infinite steps(1);
        }

        @keyframes image-flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        @keyframes shake {
            0% { transform: translate(0, 0) skew(0deg); }
            20% { transform: translate(-2px, 1px) skew(-2deg); }
            40% { transform: translate(2px, -1px) skew(3deg); }
            60% { transform: translate(-1px, -2px) skew(-1deg); }
            80% { transform: translate(1px, 2px) skew(2deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }


        @keyframes color-flash {
            0%, 100% { color: #ffffff; text-shadow: 0 0 8px #fff; }
            40% { color: #030303; text-shadow: none; } 
            70% { color: #ffffff; text-shadow: -2px 0 red, 2px 0 blue; } 
        }
    </style>
</head>
<body>

    <div id="splash-gate">[ click anywhere to initialize terminal ]</div>

    <!-- L_15: this isn't an experiment-->

    <audio id="ambient-audio" src="audio.mp3" loop></audio>

    <img src="mistero.png" alt="[CORRUPTED_FILE]" class="arg-image">

    <div class="glitch" id="scramble-text" data-value="it's walking behind you">it's walking behind you</div>

    <script>
        const audio = document.getElementById('ambient-audio');
        const gate = document.getElementById('splash-gate');

        gate.addEventListener('click', () => {
            gate.style.display = 'none'; 
            audio.play().catch(error => console.log("Audio playback blocked/waiting."));
        }); 

        const letters = "☠☣⚡ΞΨΩαβγδεζηθικλμνξοπρστυφχψω0123456789§¶@#$æœçƒ";
        const element = document.getElementById("scramble-text");
        const originalText = element.dataset.value;

        setInterval(() => {
            element.innerText = originalText
                .split("")
                .map((char, index) => {
                    if (char === " " || char === "'") return char; 
                    
                    if (Math.random() < 0.3) {
                        return letters[Math.floor(Math.random() * letters.length)];
                    }
                    return originalText[index];
                })
                .join("");
        }, 80);
    </script>

</body>
</html>
