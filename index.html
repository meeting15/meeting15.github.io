<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_FAILURE</title>
    <style>
        body {
            background-color: #030303;
            color: #00ff66; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; 
        }
        
        #splash-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #030303;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff66;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .arg-image {
            max-width: 75%;
            max-height: 45vh;
            filter: grayscale(100%) contrast(200%) brightness(70%) blur(0.5px);
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            margin-bottom: 20px;
            display: none; 
            cursor: pointer;
            transition: filter 0.3s ease;
            position: relative;
            z-index: 10;
        }

        #terminal-log {
            width: 85%;
            height: 80vh; 
            font-size: 0.85rem;
            color: #00ff66;
            overflow: hidden;
            text-align: left;
            white-space: pre-line;
            opacity: 0.9;
        }

        .glitch {
            font-size: 0.95rem; 
            font-weight: normal; 
            text-transform: lowercase; 
            position: relative;
            letter-spacing: 2px;
            animation: shake 0.12s infinite, color-flash 0.35s infinite steps(1);
            
            display: none; 
            opacity: 0; 
            transition: opacity 0.3s ease;
            cursor: pointer;
            z-index: 10;
        }

        .glitch.revealed {
            display: block;
        }

        .glitch.revealed:hover {
            opacity: 1;
        }

        #password-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        #password-input {
            background: #030303;
            border: 2px solid #00ff66;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            letter-spacing: 2px;
        }

        #password-status {
            font-size: 0.8rem;
            margin-top: 8px;
            height: 1.2rem;
            color: #ff3333;
            letter-spacing: 1px;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) skew(0deg); }
            20% { transform: translate(-2px, 1px) skew(-2deg); }
            40% { transform: translate(2px, -1px) skew(3deg); }
            60% { transform: translate(-1px, -2px) skew(-1deg); }
            80% { transform: translate(1px, 2px) skew(2deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        @keyframes color-flash {
            0%, 100% { color: #ffffff; text-shadow: 0 0 8px #fff; }
            40% { color: #030303; text-shadow: none; } 
            70% { color: #ffffff; text-shadow: -2px 0 red, 2px 0 blue; } 
        }
    </style>
</head>
<body>

    <div id="splash-gate">[ click anywhere to initialize terminal ]</div>

    <!-- LOG_ENTRY_1.5: it's very much like a dream but it isnt -->

    <audio id="ambient-audio" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
        <source src="audio.mp3" type="audio/mp3">
    </audio>

    <audio id="click-audio-template" src="click.mp3" preload="auto"></audio>

    <div id="terminal-log"></div>

    <img src="mistero.png" alt="[CORRUPTED_FILE]" class="arg-image" id="main-image">

    <div id="password-container">
        <input type="password" id="password-input" placeholder="ENTER ACCESS CODE" autocomplete="off">
        <div id="password-status"></div>
    </div>

    <div class="glitch" id="scramble-text" data-value="it's walking behind you">it's walking behind you</div>

    <script>
        const audio = document.getElementById('ambient-audio');
        const gate = document.getElementById('splash-gate');
        const logWindow = document.getElementById('terminal-log');
        const mainImage = document.getElementById('main-image');
        const scrambleText = document.getElementById('scramble-text');
        const passwordContainer = document.getElementById('password-container');
        const passwordInput = document.getElementById('password-input');
        const passwordStatus = document.getElementById('password-status');
        const clickAudioTemplate = document.getElementById('click-audio-template');

        const TARGET_HASH = "0fd924362117d03662f0e86e580ab01c70d3fa88dbffce4224017e86e5fbad52"; 
        const REDIRECT_URL = "https://meeting15/override.github.io"; 

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function playPitchedClick(clickCount) {
            const clickAudio = clickAudioTemplate.cloneNode(true); 
            const pitchScale = Math.max(0.7, 1.0 - (clickCount * 0.06)); 
            clickAudio.playbackRate = pitchScale;
            clickAudio.play().catch(err => console.warn("Click audio play failed:", err));
        }

        const logLines = [
            "fetching repository metadata",
            "connecting to core.sys.local",
            "warning: patch_15 verification failure",
            "unpacking payload_09.dat",
            "extracting /root/usr/bin/watcher",
            "overriding security protocols",
            "error: unexpected end of stream",
            "injecting binary sequence",
            "corrupting memory sector 0x7FFF",
            "file_not_found: escape_route.exe",
            "running process_id_666...",
            "system status: compromised",
            "they are listening",
            "package installed successfully",
            "you should not dig further.sys has unexpectedly failed!"
        ];

        function startScrambleAnimation() {
            const letters = "☠☣ΞΨΩαβγδεζηθικλμνξοπρστυφχψω0123456789§¶@#$æœçƒ";
            const originalText = scrambleText.dataset.value;

            setInterval(() => {
                scrambleText.innerText = originalText
                    .split("")
                    .map((char, index) => {
                        if (char === " " || char === "'") return char; 
                        if (Math.random() < 0.3) {
                            return letters[Math.floor(Math.random() * letters.length)];
                        }
                        return originalText[index];
                    })
                    .join("");
            }, 80);
        }

        function startTerminalLog() {
            let lineIndex = 0;
            const maxVisibleLines = 25; 
            let activeLines = [];

            const logInterval = setInterval(() => {
                let currentLine = "";
                
                if (Math.random() < 0.35 && lineIndex < logLines.length) {
                    currentLine = `> ${logLines[lineIndex]}`;
                    lineIndex++;
                } else {
                    const hex = Math.random().toString(16).substring(2, 8).toUpperCase();
                    currentLine = `[sys_log] static_core_inst_${hex}.pkg ... ok`;
                }

                activeLines.push(currentLine);
                if (activeLines.length > maxVisibleLines) {
                    activeLines.shift(); 
                }

                logWindow.innerText = activeLines.join("\n");

                if (lineIndex >= logLines.length) {
                    clearInterval(logInterval);
                    
                    setTimeout(() => {
                        logWindow.style.height = "12vh";
                        logWindow.style.fontSize = "0.75rem";
                        logWindow.innerText = "> initialization aborted.\n> connection closed.\n> [object detected]";

                        mainImage.style.display = "block";
                        scrambleText.classList.add('revealed');
                        
                        startScrambleAnimation();
                    }, 1500); 
                }
            }, 75); 
        }

        gate.addEventListener('click', () => {
            gate.style.display = 'none'; 

            audio.load();
            audio.play().catch(error => {
                console.warn("Audio play failed:", error);
            });
            
            startTerminalLog(); 
        }); 

        let imageClickCount = 0;

        mainImage.addEventListener('click', () => {
            imageClickCount++;
            
            playPitchedClick(imageClickCount);

            const newBrightness = Math.max(0, 70 - (imageClickCount * 14));
            mainImage.style.filter = `grayscale(100%) contrast(200%) brightness(${newBrightness}%) blur(0.5px)`;

            if (imageClickCount >= 5) {
                mainImage.style.display = 'none';
                passwordContainer.style.display = 'flex';
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const userHash = await hashString(passwordInput.value);
                
                if (userHash === TARGET_HASH) {
                    passwordStatus.style.color = "#00ff66";
                    passwordStatus.innerText = "> ACCESS GRANTED";
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 1000);
                } else {
                    passwordStatus.innerText = "> ACCESS DENIED";
                    passwordInput.value = "";
                }
            }
        });
    </script>

</body>
</html>
