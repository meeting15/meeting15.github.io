<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_FAILURE</title>
    <style>
        body {
            background-color: #030303;
            color: #00ff66; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; 
            cursor: pointer; 
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .arg-image {
            max-width: 75%;
            max-height: 45vh;
            filter: grayscale(100%) contrast(200%) brightness(70%) blur(0.5px);
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            margin-bottom: 30px;
            animation: image-flicker 0.15s infinite;
        }

        .glitch {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.025em -0.05em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            animation: glitch 500ms infinite;
            letter-spacing: 2px;
        }

        @keyframes image-flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        @keyframes glitch {
            0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
            50% { text-shadow: -2px 1px 0 red, 2px -1px 0 blue; }
            100% { text-shadow: 1px -1px 0 red, -1px 2px 0 blue; }
        }
    </style>
</head>
<body>

    <!-- LOG_ENTRY_15: this isn't an experiment-->

    <audio id="ambient-audio" src="audio.mp3" loop></audio>

    <img src="mistero.jpg" alt="[CORRUPTED_FILE]" class="arg-image">

    <div class="glitch" id="scramble-text" data-value="it's walking behind you">it's walking behind you</div>

    <script>
        document.body.addEventListener('click', () => {
            const audio = document.getElementById('ambient-audio');
            audio.play().catch(error => console.log("Audio playback blocked/waiting."));
        }, { once: true }); 

        const letters = "☠☣⚡ΞΨΩαβγδεζηθικλμνξοπρστυφχψω0123456789§¶@#$";
        const element = document.getElementById("scramble-text");
        const originalText = element.dataset.value;

        setInterval(() => {
            element.innerText = originalText
                .split("")
                .map((char, index) => {
                    if (char === " " || char === "'") return char; 
                    

                    if (Math.random() < 0.3) {
                        return letters[Math.floor(Math.random() * letters.length)];
                    }
                    return originalText[index];
                })
                .join("");
        }, 80);
    </script>

</body>
</html>
