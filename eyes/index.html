<style>
:root{--bg:#030303;--line:#00ff66;--line-dim:rgba(0,255,102,.45);--err:#ff3333}
*{box-sizing:border-box}
html,body{margin:0} 
body{background:var(--bg);color:var(--line);font-family:'Courier New',Courier,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px;overflow-x:hidden;user-select:none}
body::before{content:" ";display:block;position:fixed;inset:0;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));background-size:100% 2px,3px 100%;pointer-events:none;z-index:2}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.85) 100%)}
#stage{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:22px;transition:opacity .8s}
#grid{--cell:clamp(78px,24vw,124px);display:grid;grid-template-columns:repeat(3,var(--cell));grid-template-rows:repeat(3,var(--cell));animation:flick 6s infinite}
#grid.shake{animation:shake .45s linear} 
.cell{background:transparent;border:0;padding:14%;margin:0;color:var(--line);cursor:pointer;position:relative;font:inherit;transition:background .25s}
.cell:nth-child(-n+6){border-bottom:2px solid var(--line-dim)}
.cell:not(:nth-child(3n)){border-right:2px solid var(--line-dim)}
.cell:hover{background:rgba(0,255,102,.06)}
.cell:focus-visible{outline:1px dashed var(--line);outline-offset:-6px}
.cell svg{width:100%;height:100%;display:block;transform-origin:50% 50%;filter:drop-shadow(0 0 5px rgba(0,255,102,.55))}
.cell.blink svg{animation:lid .18s}
.eye *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .f{fill:currentColor;stroke:none}
.eye .r{stroke:var(--err)}
.eye .f.r{fill:var(--err);stroke:none}
.eye .t{transform:translate(var(--px,0px),var(--py,0px));transition:transform .12s ease-out}
#status{min-height:1.3em;font-size:clamp(.68rem,1.8vw,.82rem);letter-spacing:2px;text-align:center;color:var(--err)}
#warn{margin-top:6px;padding:7px 12px;border:1px dashed rgba(255,51,51,.55);color:#c44;font-size:clamp(.6rem,1.6vw,.72rem);letter-spacing:2px;text-align:center;opacity:.8}
@keyframes shake{0%{transform:translate(0,0) skew(0)}20%{transform:translate(-2px,1px) skew(-2deg)}40%{transform:translate(2px,-1px) skew(3deg)}60%{transform:translate(-1px,-2px) skew(-1deg)}80%{transform:translate(1px,2px) skew(2deg)}100%{transform:translate(0,0) skew(0)}}
@keyframes lid{50%{transform:scaleY(.06)}}
@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}} 
</style>
</head>

const SENTINEL = "/*ok*/";
const EYE_LETTERS = "abcdefghi";
const SVG_OPEN = '<svg class="eye" viewBox="0 0 48 48" aria-hidden="true">';
const ALMOND = '<path d="M3 24Q24 5 45 24Q24 43 3 24Z"/>';
const T = x => '<g class="t">' + x + '</g>';

const EYES = [
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="24" r="8"/><circle class="f" cx="24" cy="24" r="3.5"/>') + '</svg>', // A
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="24" r="8"/><ellipse class="f" cx="24" cy="24" rx="1.8" ry="6.5"/>') + '</svg>', // B
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="24" r="9"/><circle class="f" cx="24" cy="19.5" r="2.1"/><circle class="f" cx="19.6" cy="27" r="2.1"/><circle class="f" cx="28.4" cy="27" r="2.1"/>') + '</svg>', // C
  SVG_OPEN + '<path d="M3 24Q24 40 45 24"/><path d="M11 31L8 37M24 35V42M37 31L40 37"/></svg>', // D
  SVG_OPEN + ALMOND + '<path class="r" d="M3 24L15 21M45 24L33 21M10 14L18 19M38 14L30 19M12 34L19 29M36 34L29 29"/>' + T('<circle class="r" cx="24" cy="24" r="8"/><circle class="f" cx="24" cy="24" r="3.5"/>') + '</svg>', // E
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="23" r="7"/><circle class="f" cx="24" cy="23" r="3"/>') + '<path d="M24 34V38"/><path class="f" d="M15 36Q12.5 40 15 42.5Q17.5 40 15 36Z"/><path class="f" d="M33 38Q30.5 42 33 44.5Q35.5 42 33 38Z"/></svg>', // F
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="24" r="9"/><circle cx="24" cy="24" r="5.5" stroke-dasharray="10 4"/><circle class="f" cx="24" cy="24" r="2.2"/>') + '</svg>', // G
  SVG_OPEN + ALMOND + T('<circle cx="24" cy="24" r="8"/><circle class="f" cx="24" cy="24" r="3.5"/>') + '<path class="r" stroke-width="2.6" d="M14 14L34 34M34 14L14 34"/></svg>', // H
  SVG_OPEN + '<path d="M3 24H45"/><path d="M3 24Q24 43 45 24"/><path d="M16 24A8 8 0 0 0 32 24Z"/><path class="f" d="M21 24A3 3 0 0 0 27 24Z"/><path d="M6 17Q24 9 42 17"/></svg>' // I
]; // this is horrible but it works and i found it for free (2)

let audioCtx;
function beep(freq, start, dur, gain = 0.04, type = 'square') {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator(), a = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(a); a.connect(audioCtx.destination);
  a.gain.setValueAtTime(0, start);
  a.gain.linearRampToValueAtTime(gain, start + 0.01);
  a.gain.linearRampToValueAtTime(0, start + dur);
  o.start(start); o.stop(start + dur + 0.02);
}

const cells = Array.from(document.querySelectorAll('.cell'));
const gridEl = document.getElementById('grid');
const statusEl = document.getElementById('status');
const state = new Array(9).fill(-1);
let busy = false, fails = 0, idleTimer;

const WRONG = ['THEY ARE NOT LOOKING THE RIGHT WAY', 'NO. LOOK AGAIN.', 'THEY KNOW YOU ARE GUESSING', 'DO NOT LOOK AWAY', 'THEY ARE GETTING CLOSER'];

function attempt() {
  busy = true;
  const pwd = state.map(i => EYE_LETTERS[i]).join('');

  try {
    const code = CryptoJS.AES.decrypt(ENCRYPTED_PAYLOAD, pwd).toString(CryptoJS.enc.Utf8);
    if (!code || !code.startsWith(SENTINEL)) throw new Error("Invalid");
    cells.forEach(c => c.disabled = true);
    clearTimeout(idleTimer);
    beep(70, audioCtx.currentTime, 0.5, 0.03, 'sawtooth');
    setTimeout(() => {
      const s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    }, 350);
  } catch (e) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    beep(110, audioCtx.currentTime, 0.28, 0.07, 'sawtooth');
    beep(104, audioCtx.currentTime + 0.02, 0.28, 0.05, 'sawtooth');
    statusEl.style.color = 'var(--err)';
    statusEl.textContent = '> ' + WRONG[Math.min(fails++, WRONG.length - 1)];
    gridEl.classList.remove('shake'); void gridEl.offsetWidth; gridEl.classList.add('shake');
    setTimeout(() => { statusEl.textContent = ''; }, 2600);
    busy = false;
  }
}

cells.forEach((el, i) => {
  el.addEventListener('click', () => {
    if (busy) return;
    state[i] = state[i] >= EYES.length - 1 ? -1 : state[i] + 1;
    el.innerHTML = state[i] < 0 ? '' : EYES[state[i]];
    beep(state[i] < 0 ? 140 : 200 + state[i] * 38, (audioCtx ? audioCtx.currentTime : 0), 0.07, 0.035, 'triangle');
    statusEl.textContent = '';
    track(lastX, lastY);
    resetIdle();
    if (state.every(v => v >= 0)) attempt();
  });
});

let lastX = innerWidth / 2, lastY = innerHeight / 2;
function track(x, y) {
  lastX = x; lastY = y;
  cells.forEach(c => {
    const r = c.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, m = Math.min(4.5, d / 40);
    c.style.setProperty('--px', (dx / d * m).toFixed(2) + 'px');
    c.style.setProperty('--py', (dy / d * m * .35).toFixed(2) + 'px');
  });
}
addEventListener('pointermove', e => track(e.clientX, e.clientY));

(function blink() {
  const open = cells.filter((c, i) => state[i] >= 0 && state[i] !== 3 && state[i] !== 8);
  if (open.length) {
    const c = open[Math.floor(Math.random() * open.length)];
    c.classList.add('blink'); setTimeout(() => c.classList.remove('blink'), 200);
  }
  setTimeout(blink, 1500 + Math.random() * 3500);
})();

function resetIdle() {
  clearTimeout(idleTimer);
  if (busy) return;
  idleTimer = setTimeout(() => {
    statusEl.style.color = 'var(--err)';
    statusEl.textContent = '> KEEP LOOKING';
  }, 25000);
}
resetIdle();

document.addEventListener('visibilitychange', () => {
  document.title = document.hidden ? 'behind you' : 'staring';
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) || (e.ctrlKey && (e.key === 'U' || e.key === 'S'))) e.preventDefault();
});
