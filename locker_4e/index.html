<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKER_4E</title>
    <style>
        :root {
            --bg: #020302;
            --med-cyan: #7fffd4;
            --med-cyan-dim: rgba(127, 255, 212, 0.6);
            --err: #ff3333;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--med-cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        body:not(.unlocked) #boot-gate,
        body:not(.unlocked) #scene-container,
        body:not(.unlocked) #padlock-gate,
        body:not(.unlocked) #journal-container {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        body.unlocked #access-gate {
            display: none !important;
        }

        #access-gate {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 3, 0.98);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #access-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(420px, 90vw);
            padding: 24px 18px;
            border: 2px solid var(--med-cyan);
            box-shadow: 0 0 18px rgba(127, 255, 212, 0.25);
            background: #050505;
        }

        #access-label {
            font-size: clamp(0.68rem, 1.8vw, 0.82rem);
            letter-spacing: 3px;
            text-transform: lowercase;
            color: var(--med-cyan);
        }

        #access-input {
            width: min(260px, 80%);
            background: #030303;
            border: 2px solid var(--med-cyan);
            color: var(--med-cyan);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        #access-status {
            min-height: 1.2em;
            font-size: clamp(0.7rem, 1.8vw, 0.8rem);
            color: var(--err);
            letter-spacing: 1px;
        }

        #boot-gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--med-cyan);
            font-size: clamp(0.75rem, 2.3vw, 0.95rem);
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-align: center;
            padding: 20px;
            animation: pulse-text 2s infinite;
        }
        
        #scene-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: none; 
            justify-content: center;
            align-items: center;
            background: #000;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #scene-container.visible {
            display: flex;
            opacity: 1;
        }

        .locker-img-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: block; 
            animation: light-flicker 4s infinite;
        }

        #locker-image {
            display: block;
            width: 100%;
            height: auto; 
            filter: contrast(1.1) brightness(0.9);
        }

        #padlock-hotspot {
            position: absolute;
            top: 42%; 
            left: 32%;
            width: 5%; 
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            background: rgba(127, 255, 212, 0.0);
            box-shadow: 0 0 15px rgba(127, 255, 212, 0.0);
            transition: background 0.3s, box-shadow 0.3s;
            animation: subtle-pulse 3s infinite;
        }

        #padlock-hotspot:hover {
            background: rgba(127, 255, 212, 0.15);
            box-shadow: 0 0 20px rgba(127, 255, 212, 0.4);
        }

        #padlock-gate {
            position: fixed;
            inset: 0;
            background: rgba(2, 3, 2, 0.95);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #padlock-gate.visible {
            display: flex;
            opacity: 1;
        }

        #padlock-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: min(380px, 90vw);
            padding: 30px 20px;
            border: 1px solid var(--med-cyan);
            box-shadow: inset 0 0 20px rgba(127, 255, 212, 0.1);
            background: rgba(5, 10, 8, 0.9);
        }

        #padlock-label {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--med-cyan);
            margin-bottom: 10px;
        }

        #padlock-input {
            width: 80%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--med-cyan);
            color: var(--med-cyan);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            outline: none;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        #padlock-status {
            min-height: 1.2em;
            font-size: clamp(0.7rem, 1.8vw, 0.8rem);
            color: var(--err);
            letter-spacing: 1px;
        }

        #journal-container {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: clamp(30px, 5vw, 60px);
            opacity: 0;
            transition: opacity 3s ease;
            overflow-y: auto;
        }

        #journal-container.visible {
            display: flex;
            opacity: 1;
        }

        #journal-content {
            width: min(720px, 100%);
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 50px;
        }

        .log-entry {
            border-left: 2px solid var(--med-cyan-dim);
            padding-left: 15px;
            opacity: 0;
        }

        .log-date {
            font-size: clamp(0.65rem, 1.5vw, 0.75rem);
            color: var(--med-cyan-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .log-text {
            font-size: clamp(0.85rem, 2vw, 1rem);
            line-height: 1.7;
            color: var(--med-cyan);
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--med-cyan);
            vertical-align: -2px;
            animation: pulse-text 0.9s steps(1) infinite;
        }

        .log-prompt-wrapper {
            margin-top: 5px;
            padding-left: 15px;
            color: var(--err);
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            letter-spacing: 1px;
        }

        .log-prompt-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--err);
            color: var(--med-cyan);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: min(180px, 40vw);
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-left: 8px;
        }

        .log-prompt-input.success {
            border-bottom-color: var(--med-cyan);
            color: var(--med-cyan);
        }

        @keyframes pulse-text { 0%, 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }
        @keyframes subtle-pulse { 0%, 100% { background: rgba(127, 255, 212, 0); } 50% { background: rgba(127, 255, 212, 0.08); } }
        
        @keyframes light-flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.4; }
            94% { opacity: 0.9; }
            96% { opacity: 0.3; }
            98% { opacity: 1; }
        }

        #journal-container::-webkit-scrollbar { width: 8px; }
        #journal-container::-webkit-scrollbar-track { background: #030303; border-left: 1px solid rgba(127, 255, 212, 0.1); }
        #journal-container::-webkit-scrollbar-thumb { background: var(--med-cyan-dim); }

    </style>
</head>
<body>

    <div id="access-gate">
        <div id="access-box">
            <div id="access-label">[ access required ]</div>
            <input type="password" id="access-input" placeholder="ENTER ACCESS CODE" autocomplete="off">
            <div id="access-status"></div>
        </div>
    </div>

    <div id="boot-gate">[ click to descend ]</div>

    <div id="scene-container">
        <div class="locker-img-wrapper">
            <img src="locker.jpg" id="locker-image" alt="Basement Lockers">
            <div id="padlock-hotspot"></div>
        </div>
    </div>

    <!-- INNER PADLOCK GATE -->
    <div id="padlock-gate">
        <div id="padlock-box">
            <div id="padlock-label">Locker Combination</div>
            <input type="text" id="padlock-input" autocomplete="off" maxlength="10">
            <div id="padlock-status"></div>
        </div>
    </div>

    <div id="journal-container">
        <div id="journal-content"></div>
    </div>

    <script>
        const PAGE_ACCESS_HASH = "c7a23051107ca2715d838de803da81aebff211dce998b328e0e80054f9c89ac4";

        const accessGate = document.getElementById('access-gate');
        const accessInput = document.getElementById('access-input');
        const accessStatus = document.getElementById('access-status');

        const bootGate = document.getElementById('boot-gate');
        const sceneContainer = document.getElementById('scene-container');
        const padlockHotspot = document.getElementById('padlock-hotspot');
        
        const padlockGate = document.getElementById('padlock-gate');
        const padlockInput = document.getElementById('padlock-input');
        const padlockStatus = document.getElementById('padlock-status');
        
        const journalContainer = document.getElementById('journal-container');
        const journalContent = document.getElementById('journal-content');

        let audioCtx;

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function beep(freq, startTime, duration, gain = 0.05, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const amp = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(amp);
            amp.connect(audioCtx.destination);
            amp.gain.setValueAtTime(0, startTime);
            amp.gain.linearRampToValueAtTime(gain, startTime + 0.01);
            amp.gain.linearRampToValueAtTime(0.0001, startTime + duration);
            osc.start(startTime);
            osc.stop(startTime + duration + 0.05);
        }

        function typeTick() {
            if (!audioCtx) return;
            beep(800 + Math.random() * 100, audioCtx.currentTime, 0.03, 0.02, 'triangle');
        }

        function startAmbientHum() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;

            const hum = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter(); 
            const humGain = audioCtx.createGain();
            
            hum.type = 'sawtooth';
            hum.frequency.setValueAtTime(50, now); 
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, now);

            humGain.gain.setValueAtTime(0, now);
            humGain.gain.linearRampToValueAtTime(0.004, now + 3.0); 
            
            hum.connect(filter);
            filter.connect(humGain);
            humGain.connect(audioCtx.destination);
            hum.start(now);
        }

        const logs = [
            { 
                date: "LOG_01 // SEP 14", 
                text: "uncle made me get this job. it's cold down here. but i like it. the bodies are quiet. they don't yell and they don't break plates." 
            },
            { 
                date: "LOG_04 // OCT 02", 
                text: "void didn't reply to me today. i saw him with those other kids. they are so loud. they laughed at me. i hate loud people. they are taking him away.",
                hash: "e7bf93b428bead01dad66ac3e48f9b652f8fa9e6a741946ae58b5cacf0e7c31f" 
            },
            { 
                date: "LOG_09 // NOV 11", 
                text: "i cleaned a new one today. it was a man from our street who used to scream a lot. he looks so peaceful now. death fixes people. it takes away the loud parts.",
                hash: "378ce56a9d146d5174c89d1c0353d7f8e2244e89bb83935a5b1bdcf5e74b4e7f"
            },
            { 
                date: "LOG_12 // DEC 05", 
                text: "i figured it out. i know how to get void back. if his friends are quiet, he'll listen to me again. i just have to fix them. i will make them peaceful.",
                hash: "d887db09649dab0d83951d8d5d69b2e7d8bb70e79daa2a3a279b4fd6b8346cea" 
            }
        ];

        function createDecryptionPrompt(nextIndex) {
            const wrapper = document.createElement('div');
            wrapper.className = 'log-prompt-wrapper';
            wrapper.style.opacity = 0;
            wrapper.style.transition = 'opacity 1s';
            
            const label = document.createElement('span');
            label.innerText = "> ENCRYPTED. ENTER PASSKEY:";
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'log-prompt-input';
            input.autocomplete = 'off';
            
            wrapper.appendChild(label);
            wrapper.appendChild(input);
            journalContent.appendChild(wrapper);

            journalContainer.scrollTo({
                top: journalContainer.scrollHeight,
                behavior: 'smooth'
            });
            
            setTimeout(() => { 
                wrapper.style.opacity = 1; 
                input.focus(); 
            }, 100);
            
            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const val = input.value.trim().toLowerCase();
                    const hash = await hashString(val);
                    
                    if (hash === logs[nextIndex].hash) {
                        input.disabled = true;
                        input.classList.add('success');
                        label.style.color = 'var(--med-cyan)';
                        wrapper.style.color = 'var(--med-cyan)';
                        label.innerText = "> DECRYPTED:";
                        
                        if (audioCtx) beep(1200, audioCtx.currentTime, 0.1, 0.05, 'square');
                        
                        setTimeout(() => {
                            typeJournalEntry(nextIndex);
                        }, 500);
                    } else {
                        input.value = '';
                        if (audioCtx) beep(300, audioCtx.currentTime, 0.2, 0.05, 'sawtooth');
                        wrapper.style.color = 'var(--err)';
                        label.innerText = "> INVALID PASSKEY. TRY AGAIN:";
                    }
                }
            });
        }

        async function typeJournalEntry(logIndex) {
            if (logIndex >= logs.length) return;

            const entry = logs[logIndex];
            const entryDiv = document.createElement('div');
            entryDiv.className = 'log-entry';
            
            const dateDiv = document.createElement('div');
            dateDiv.className = 'log-date';
            dateDiv.innerText = entry.date;
            
            const textDiv = document.createElement('div');
            textDiv.className = 'log-text';
            
            entryDiv.appendChild(dateDiv);
            entryDiv.appendChild(textDiv);
            journalContent.appendChild(entryDiv);

            entryDiv.style.transition = 'opacity 1s';
            
            await new Promise(r => setTimeout(r, 50));
            entryDiv.style.opacity = 1;

            journalContainer.scrollTo({
                top: journalContainer.scrollHeight,
                behavior: 'smooth'
            });

            await new Promise(r => setTimeout(r, 800));

            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            textDiv.appendChild(cursor);

            let charIdx = 0;
            
            function typeNextChar() {
                if (charIdx < entry.text.length) {
                    const char = entry.text[charIdx];
                    textDiv.insertBefore(document.createTextNode(char), cursor);
                    if (char !== " ") typeTick();
                    
                    charIdx++;
                    
                    let delay = 35;
                    if (char === '.') delay = 400;
                    if (char === ',') delay = 200;
                    
                    if (charIdx % 20 === 0) {
                        journalContainer.scrollTop = journalContainer.scrollHeight;
                    }
                    
                    setTimeout(typeNextChar, delay);
                } else {
                    cursor.remove();
                    
                    if (logIndex + 1 < logs.length) {
                        setTimeout(() => {
                            createDecryptionPrompt(logIndex + 1);
                        }, 1000);
                    }
                }
            }
            
            typeNextChar();
        }

        document.body.classList.remove('unlocked');
        setTimeout(() => accessInput.focus(), 200);

        accessInput.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;

            const rawInput = accessInput.value.trim().toLowerCase();
            const userHash = await hashString(rawInput);

            if (userHash === PAGE_ACCESS_HASH) {
                accessStatus.style.color = 'var(--med-cyan)';
                accessStatus.innerText = '> ACCESS GRANTED';
                accessInput.value = '';
                document.body.classList.add('unlocked');
                return;
            }

            accessStatus.style.color = 'var(--err)';
            accessStatus.innerText = '> ACCESS DENIED';
            accessInput.value = '';
        });

        // --- BOOT & PADLOCK LOGIC ---
        bootGate.addEventListener('click', () => {
            bootGate.style.display = 'none';
            startAmbientHum();
            sceneContainer.classList.add('visible');
        });

        padlockHotspot.addEventListener('click', () => {
            if (audioCtx) beep(1200, audioCtx.currentTime, 0.1, 0.05, 'square');
            padlockGate.classList.add('visible');
            setTimeout(() => padlockInput.focus(), 100);
        });

        padlockGate.addEventListener('click', (e) => {
            if (e.target === padlockGate) {
                padlockGate.classList.remove('visible');
                padlockInput.value = '';
                padlockStatus.innerText = '';
            }
        });

        padlockInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Escape') {
                padlockGate.classList.remove('visible');
                return;
            }
            
            if (e.key === 'Enter') {
                const rawInput = padlockInput.value.trim().toLowerCase();
                
                if (rawInput === '4e') {
                    padlockStatus.style.color = 'var(--med-cyan)';
                    padlockStatus.innerText = '> PADLOCK UNLOCKED';
                    if (audioCtx) beep(1800, audioCtx.currentTime, 0.15, 0.05, 'sine');
                    
                    setTimeout(() => {
                        padlockGate.classList.remove('visible');
                        sceneContainer.style.opacity = '0';
                        
                        setTimeout(() => {
                            sceneContainer.style.display = 'none';
                            journalContainer.classList.add('visible');
                            
                            setTimeout(() => {
                                typeJournalEntry(0);
                            }, 1000);
                            
                        }, 2000);
                    }, 1000);
                } else {
                    padlockStatus.style.color = 'var(--err)';
                    padlockStatus.innerText = '> INCORRECT COMBINATION';
                    if (audioCtx) beep(300, audioCtx.currentTime, 0.2, 0.05, 'sawtooth');
                    padlockInput.value = '';
                }
            }
        });
    </script>
</body>
</html>
