<html lang="en">

    <title>wakeup</title>

    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        user-select: none;
      }
      
      body.locked #start, body.locked #end, body.locked #cv,
      body.locked #fx, body.locked .lid, body.locked .hud,
      body.locked #vig, body.locked #sub {
          display: none !important;
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
      }

      #access-gate {
          position: fixed;
          inset: 0;
          background: #000;
          z-index: 9999;
          display: none;
          align-items: center;
          justify-content: center;
          padding: 20px;
      }

      body.locked #access-gate {
          display: flex;
      }

      #access-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          width: min(420px, 90vw);
          padding: 24px 18px;
          border: 1px solid #333;
          background: #050505;
      }

      #access-label {
          font-size: clamp(0.68rem, 1.8vw, 0.82rem);
          letter-spacing: 3px;
          text-transform: lowercase;
          color: #666;
      }

      #access-input {
          width: min(260px, 80%);
          background: #020202;
          border: 1px solid #444;
          color: #aaa;
          font-family: 'Courier New', monospace;
          padding: 10px;
          font-size: clamp(0.8rem, 2vw, 0.95rem);
          outline: none;
          text-align: center;
          letter-spacing: 2px;
      }

      #access-input:focus { border-color: #777; }

      #access-status {
          min-height: 1.2em;
          font-size: clamp(0.7rem, 1.8vw, 0.8rem);
          color: #a22; 
          letter-spacing: 1px;
      }

      #cv {
        position: absolute;
        inset: 0;
        filter: contrast(1.3) saturate(0.5) sepia(0.3) brightness(0.85);
      }
      #vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, transparent 35%, rgba(0, 0, 0, 0.95) 100%);
        pointer-events: none;
        z-index: 5;
      }
      #fx {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 10;
      }
      .hud {
        position: absolute;
        color: #fff;
        font-weight: bold;
        text-shadow: 2px 0 red, -2px 0 #36f;
        z-index: 11;
        opacity: 0;
        font-size: clamp(1.1rem, 3.4vw, 2rem);
      }
      #t1 { top: calc(env(safe-area-inset-top, 0px) + 5%); left: 5%; }
      #t2 { bottom: 8%; left: 5%; font-size: clamp(0.9rem, 2.4vw, 1.4rem); }
      #t3 { bottom: 8%; right: 5%; font-size: clamp(0.9rem, 2.4vw, 1.4rem); }
      .lid {
        position: absolute;
        left: 0;
        width: 100%;
        background: #000;
        z-index: 20;
        height: 50vh;
      }
      #sub {
        position: absolute;
        bottom: 20%;
        width: 100%;
        text-align: center;
        color: #ddd;
        font-size: clamp(0.9rem, 2.2vw, 1.3rem);
        z-index: 12;
        text-shadow: 0 0 6px #000, 1px 0 red;
        opacity: 0;
        transition: opacity 0.8s;
        letter-spacing: 2px;
        padding: 0 6%;
        box-sizing: border-box;
      }
      #start, #end {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        color: #888;
        letter-spacing: 3px;
        cursor: pointer;
        background: #000;
        text-align: center;
        padding: 0 6%;
      }
      #end { display: none; z-index: 40; color: #a22; }
      .b { animation: bl 1s steps(1) infinite; }
      @keyframes bl { 50% { opacity: 0; } }
    </style>

      const accessInput = document.getElementById('access-input');
      const accessStatus = document.getElementById('access-status');

      setTimeout(() => accessInput.focus(), 200);

      accessInput.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          const pwd = accessInput.value.trim();
          if (!pwd) return;

          try {
              const bytes = CryptoJS.AES.decrypt(ENCRYPTED_PAYLOAD, pwd);
              const decryptedCode = bytes.toString(CryptoJS.enc.Utf8);

              if (!decryptedCode) throw new Error("Decryption failed");

              accessStatus.style.color = '#888';
              accessStatus.innerText = '> ACCESS GRANTED';
              accessInput.value = '';
              accessInput.disabled = true;

              setTimeout(() => {
                  document.body.classList.remove('locked');
                  const script = document.createElement('script');
                  script.innerHTML = decryptedCode;
                  document.body.appendChild(script);
              }, 600);

          } catch (err) {
              accessStatus.style.color = '#a22';
              accessStatus.innerText = '> ACCESS DENIED';
              accessInput.value = '';
          }
      }); // goodluck decrypting ts
