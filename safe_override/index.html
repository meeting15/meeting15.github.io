<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMERGENCY_REBOOT</title>
    <style>
        :root {
            --bg: #030303;
            --panel: rgba(10, 6, 6, 0.96);
            --line-red: #ff3333;
            --line-green: #00ff66;
            --text-red: #ffcccc;
            --text-green: #dfffe9;
            --shadow-red: rgba(255, 51, 51, 0.28);
            --shadow-green: rgba(0, 255, 102, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--line-red);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: clamp(16px, 3vw, 32px);
            overflow-x: hidden;
            user-select: none;
            transition: background-color 2s ease, color 2s ease;
        }

        body.stabilized {
            color: var(--line-green);
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 2;
        }

        body:not(.unlocked) #boot-gate,
        body:not(.unlocked) #terminal {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        body.unlocked #access-gate {
            display: none !important;
        }

        #boot-gate {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--line-red);
            font-size: clamp(0.75rem, 2.3vw, 0.95rem);
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            padding: 20px;
            animation: pulse-text 1.5s infinite;
        }

        #access-gate {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 3, 0.98);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #access-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(420px, 90vw);
            padding: 24px 18px;
            border: 2px solid var(--line-red);
            box-shadow: 0 0 18px var(--shadow-red);
            background: #050505;
        }

        #access-label {
            font-size: clamp(0.68rem, 1.8vw, 0.82rem);
            letter-spacing: 3px;
            text-transform: lowercase;
            color: var(--line-red);
        }

        #access-input {
            width: min(260px, 80%);
            background: var(--bg);
            border: 2px solid var(--line-red);
            color: var(--line-red);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        #access-status {
            min-height: 1.2em;
            font-size: clamp(0.7rem, 1.8vw, 0.8rem);
            color: #ffffff;
            letter-spacing: 1px;
        }

        #terminal {
            position: relative;
            z-index: 10;
            width: min(850px, 100%);
            height: clamp(300px, 75vh, 650px);
            background: var(--panel);
            border: 2px solid var(--line-red);
            box-shadow: 0 0 22px var(--shadow-red);
            padding: clamp(18px, 4vw, 24px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            line-height: 1.6;
            opacity: 0;
            transition: border-color 2s ease, box-shadow 2s ease, opacity 0.6s ease;
        }

        body.stabilized #terminal {
            border-color: var(--line-green);
            box-shadow: 0 0 22px var(--shadow-green);
        }

        #terminal.visible {
            opacity: 1;
        }

        .log-line {
            opacity: 0;
            animation: fadeIn 0.1s forwards;
            letter-spacing: 1px;
        }

        .critical { color: var(--line-red); font-weight: bold; text-shadow: 0 0 8px rgba(255, 51, 51, 0.6); }
        .system { color: #aaaaaa; }
        .stabilized-text { color: var(--line-green); text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
        .glitch-text { animation: shake 0.15s infinite; display: inline-block; }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        #terminal::-webkit-scrollbar { width: 8px; }
        #terminal::-webkit-scrollbar-track { background: #030303; }
        #terminal::-webkit-scrollbar-thumb { background: var(--line-red); transition: background 2s ease; }
        body.stabilized #terminal::-webkit-scrollbar-thumb { background: var(--line-green); }

    </style>
</head>
<body>

    <div id="access-gate">
        <div id="access-box">
            <div id="access-label">[ critical failure override ]</div>
            <input type="password" id="access-input" placeholder="ENTER CODE" autocomplete="off">
            <div id="access-status"></div>
        </div>
    </div>

    <div id="boot-gate">[ click to initiate emergency psych-restore ]</div>

    <div id="terminal"></div>

    <script>
        const ACCESS_HASH = "c807d4d6327ad2b4265e9b3b2c69e25aecc839c388fdda9be6194c55c94e5ebd";

        const bootGate = document.getElementById('boot-gate');
        const accessGate = document.getElementById('access-gate');
        const accessInput = document.getElementById('access-input');
        const accessStatus = document.getElementById('access-status');
        const terminal = document.getElementById('terminal');

        let audioCtx;

        function beep(freq, startTime, duration, gain = 0.05, type = 'square') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const amp = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(amp);
            amp.connect(audioCtx.destination);
            amp.gain.setValueAtTime(0, startTime);
            amp.gain.linearRampToValueAtTime(gain, startTime + 0.01);
            amp.gain.linearRampToValueAtTime(0, startTime + duration);
            osc.start(startTime);
            osc.stop(startTime + duration + 0.02);
        }

        function playCriticalTick() {
            if (!audioCtx) return;
            beep(300 + Math.random() * 100, audioCtx.currentTime, 0.03, 0.04, 'sawtooth');
        }

        function playStabilizeTick() {
            if (!audioCtx) return;
            beep(1200 + Math.random() * 200, audioCtx.currentTime, 0.02, 0.015, 'sine');
        }

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const logLines = [
            { text: "FATAL EXCEPTION 0E CAUGHT IN SECTOR 4.", type: "critical", delay: 800 },
            { text: "CAUSE: AUDIO CORTEX OVERLOAD [SHOT.WAV]", type: "critical", delay: 1200 },
            { text: "SUBJECT: Xx_VO1D_xX", type: "system", delay: 500 },
            { text: "HEART RATE: 184 BPM ... CRITICAL DISTRESS DETECTED.", type: "critical", delay: 1500 },
            { text: "PSYCHOLOGICAL FRAMEWORK REJECTING SIMULATION.", type: "glitch-text critical", delay: 1200 },
            { text: "ADMINISTERING COGNITIVE SUPPRESSANTS...", type: "system", delay: 2000 },
            { text: "WARNING: SUPPRESSANTS FAILED.", type: "critical", delay: 800 },
            { text: "SUBJECT IS SPIRALING.", type: "critical", delay: 1500 },
            { text: "INITIATING EMERGENCY SAFE MODE.", type: "system", delay: 2500 },
            { text: "SCANNING SUBJECT MEMORY BANKS FOR SAFE ANCHOR...", type: "system", delay: 1800 },
            { text: "[████████░░░░░░░░░░░░] 34%", type: "system", delay: 800 },
            { text: "[███████████████░░░░░] 78%", type: "system", delay: 900 },
            { text: "[████████████████████] 100%", type: "system", delay: 1200 },
            { text: "ANCHOR FOUND.", type: "stabilized-text", delay: 1000 },
            { text: "TIMESTAMP: YEARS AGO.", type: "stabilized-text", delay: 1000 },
            { text: "TAG: 'we're best friends'", type: "stabilized-text", delay: 1500 },
            { text: "STABILIZING SUBJECT VITALS...", type: "stabilized-text", delay: 2000 },
            { text: "HEART RATE DROPPING TO 85 BPM.", type: "stabilized-text", delay: 1500 },
            { text: "LOADING SECTOR: WORLD_01.", type: "stabilized-text", delay: 2500 },
            { text: "PLEASE STAND BY FOR MEMORY PLAYBACK. IT WILL BE READY IN A FEW DAYS.", type: "stabilized-text", delay: 2000 },
            { text: "INFORMATION HAS BEEN SENT TO PERSONNEL. LOG NUMBER 15", type: "system", delay: 3000 }
        ];

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function runLogs() {
            let isStabilized = false;

            for (let i = 0; i < logLines.length; i++) {
                const line = logLines[i];
                await sleep(line.delay);
                
                const lineEl = document.createElement('div');
                lineEl.className = `log-line ${line.type}`;
                lineEl.innerText = `> ${line.text}`;
                
                terminal.appendChild(lineEl);
                terminal.scrollTop = terminal.scrollHeight;

                if (line.type === 'stabilized-text' && !isStabilized) {
                    isStabilized = true;
                    document.body.classList.add('stabilized');
                    
                    if (audioCtx) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 3);
                        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 4.1);
                    }
                }

                if (isStabilized) {
                    playStabilizeTick();
                } else {
                    playCriticalTick();
                }
            }
        }

        accessInput.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;

            const rawInput = accessInput.value.trim().toLowerCase();
            const userHash = await hashString(rawInput);

            if (userHash === ACCESS_HASH) {
                accessStatus.style.color = '#00ff66';
                accessStatus.innerText = '> OVERRIDE ACCEPTED';
                accessInput.value = '';
                document.body.classList.add('unlocked');
                setTimeout(() => {
                    accessGate.style.display = 'none';
                    bootGate.click();
                }, 500);
                return;
            }

            accessStatus.style.color = '#ff3333';
            accessStatus.innerText = '> INCORRECT CODE';
            accessInput.value = '';
        });

        document.body.classList.remove('unlocked');
        setTimeout(() => accessInput.focus(), 200);

        bootGate.addEventListener('click', () => {
            bootGate.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            terminal.classList.add('visible');
            setTimeout(runLogs, 1000);
        });
    </script>
</body>
</html>
